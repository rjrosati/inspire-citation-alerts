name: Update feed

on:
  schedule:
    - cron: "23 5 * * *"   # daily, 05:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [watchlist.json, update.py, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
      - name: Query INSPIRE
        run: python3 update.py --data-dir .data
      - name: Publish
        working-directory: .data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.json
          git diff --cached --quiet && exit 0
          git commit -m "Update feed"
          git pull --rebase origin data
          git push origin HEAD:data
